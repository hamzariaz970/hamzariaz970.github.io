name: Publish portfolio and refresh abstracts

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/configure-pages@v5
      - name: Install PDF reader
        run: python -m pip install -r scripts/requirements.txt
      - name: Check abstract extraction and fallback
        run: python -m unittest discover -s scripts/tests
      - name: Refresh abstracts
        run: python scripts/update_abstracts.py --published-cache https://hamzariaz970.github.io/assets/abstracts.json
      - name: Prepare the public site
        run: |
          mkdir _site
          cp index.html styles.css script.js robots.txt sitemap.xml .nojekyll _site/
          cp -R assets _site/assets
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy portfolio
        id: deployment
        uses: actions/deploy-pages@v4
